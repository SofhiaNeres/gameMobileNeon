<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Neon Dash</title>
<link rel="stylesheet" href="src/styles/style.css">
</head>
<body>

<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hud-box">
    <span class="hud-label">Score</span>
    <span class="hud-val" id="score-val">0</span>
  </div>
  <div class="hud-box" id="hi-box" style="text-align:right">
    <span class="hud-label">Recorde</span>
    <span class="hud-val" id="hi-val">0</span>
  </div>
</div>

<div id="pills">
  <div class="pill" id="shield-pill">🛡 ESCUDO</div>
  <div class="pill" id="slow-pill">⏳ LENTO</div>
</div>

<div id="combo-wrap"><span id="combo-val"></span></div>

<button id="pause-btn">⏸</button>

<!-- Start Screen -->
<div class="screen" id="start-screen">
  <div class="screen-title">NEON DASH</div>
  <div class="screen-sub">Esquiva · Coleta · Sobrevive</div>
  <div class="screen-hi" id="start-hi"></div>

  <div class="instructions">
    <div class="inst-item">
      <div class="inst-icon">👆</div>
      <div class="inst-label">Toque<br>Pular</div>
    </div>
    <div class="inst-item">
      <div class="inst-icon">✌️</div>
      <div class="inst-label">2× Toque<br>Pulo duplo</div>
    </div>
    <div class="inst-item">
      <div class="inst-icon">⬆️</div>
      <div class="inst-label">Deslize<br>Pulo alto</div>
    </div>
  </div>

  <button class="btn" id="start-btn">JOGAR</button>
</div>

<!-- Game Over Screen -->
<div class="screen hidden" id="gameover-screen">
  <div class="screen-title">FIM!</div>
  <div class="go-score-row">Pontuação</div>
  <div id="go-score-val">0</div>
  <div id="go-hi-val"></div>
  <button class="btn" id="restart-btn">JOGAR NOVAMENTE</button>
</div>

<!-- Pause Screen -->
<div class="screen hidden" id="pause-screen">
  <div class="screen-title">PAUSADO</div>
  <div class="screen-sub" style="margin-bottom:36px">Respira fundo ✨</div>
  <button class="btn" id="resume-btn">CONTINUAR</button>
</div>
<script src="src/js/script.js"></script>

</body>
</html>
